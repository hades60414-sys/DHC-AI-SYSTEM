# DHC AI Office v0.1 單客戶企業部署（CloudCLI UI 的 DHC 衍生版本，AGPL-3.0-or-later）。
# 一客戶一套 project/volume/secret；app 只綁本機 127.0.0.1，對外入口（HTTPS／Access）須另經授權建置，本檔不含。
name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME per customer}
services:
  app:
    image: ${DHC_IMAGE:-dhc-ai-office:local}
    pull_policy: ${DHC_PULL_POLICY:-missing}
    build:
      context: ../..
      dockerfile: deploy/customer-single/Dockerfile
      args:
        DHC_SOURCE_SHA: ${DHC_SOURCE_SHA:-unrecorded}
        DHC_IMAGE_PROFILE: enterprise
        RUNTIME_BASE: node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
    init: true
    user: node
    env_file:
      - ${DHC_SECRET_DIR:?set DHC_SECRET_DIR}/app.env
    environment:
      DHC_DEPLOYMENT_MODE: enterprise
      HOST: 0.0.0.0
      SERVER_PORT: "3001"
      DATABASE_PATH: /home/node/.cloudcli/auth.db
      VITE_IS_PLATFORM: "false"
      ENTERPRISE_DB_HOST: db
      ENTERPRISE_DB_PORT: "5432"
      ENTERPRISE_DB_NAME: ${DHC_DATABASE_NAME:-dhc_enterprise}
      ENTERPRISE_DB_USER: dhc_app
      ENTERPRISE_BLOB_ROOT: /var/lib/dhc/blobs
    networks: [default, enterprise-db]
    ports:
      - "127.0.0.1:${DHC_HTTP_PORT:-3001}:3001"
    volumes:
      - dhc-state:/home/node
      - enterprise-blobs:/var/lib/dhc/blobs
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}
    stop_grace_period: 20s
    restart: unless-stopped
  db:
    image: ${DHC_DB_IMAGE:-postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0}
    pull_policy: ${DHC_PULL_POLICY:-missing}
    env_file:
      - ${DHC_SECRET_DIR}/bootstrap.env
    environment:
      POSTGRES_USER: dhc_bootstrap
      POSTGRES_DB: ${DHC_DATABASE_NAME:-dhc_enterprise}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - enterprise-pg:/var/lib/postgresql/data
      - ../customer-single/postgres-init.sh:/docker-entrypoint-initdb.d/10-enterprise.sh:ro
    networks: [enterprise-db]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dhc_bootstrap -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  # 一次性工具：migration 與組織初始化／訂閱（供應商操作）。皆使用 migrator 帳號，不由 app 執行。
  migrate:
    profiles: [tools]
    image: ${DHC_IMAGE:-dhc-ai-office:local}
    pull_policy: ${DHC_PULL_POLICY:-missing}
    user: node
    env_file:
      - ${DHC_SECRET_DIR}/migrate.env
    environment:
      ENTERPRISE_DB_HOST: db
      ENTERPRISE_DB_PORT: "5432"
      ENTERPRISE_DB_NAME: ${DHC_DATABASE_NAME:-dhc_enterprise}
      ENTERPRISE_DB_USER: dhc_migrator
    networks: [enterprise-db]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [node]
    command: [dist-server/server/modules/enterprise-persistence/migrate.cli.js, up]
  # 備份／還原 blob volume 用的一次性容器（只掛 blob volume，沒有網路）。
  blobs:
    profiles: [tools]
    image: ${DHC_IMAGE:-dhc-ai-office:local}
    pull_policy: ${DHC_PULL_POLICY:-missing}
    user: node
    network_mode: none
    volumes:
      - enterprise-blobs:/var/lib/dhc/blobs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [tar]
volumes:
  dhc-state:
  enterprise-pg:
  enterprise-blobs:
networks:
  enterprise-db:
    internal: true
