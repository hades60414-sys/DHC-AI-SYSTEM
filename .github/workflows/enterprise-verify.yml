# DHC AI Office Enterprise：型別、lint、後端、前端與真 PostgreSQL 整合（web-ui/）。
# 不使用任何 secret；fork PR 以唯讀 token 執行。V3.2 原本就有的失敗由 known-v32-baseline-failures.json 比對，只有新失敗才讓 CI 失敗。
name: enterprise-verify
on:
  pull_request:
    branches: [main]
    paths: ['web-ui/**', '.github/workflows/enterprise-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: web-ui
jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: npm ci（不執行 lifecycle scripts）＋原生模組重建
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # 原生模組與 ripgrep 執行檔（對話搜尋測試需要；--ignore-scripts 不會下載）
          npm rebuild better-sqlite3 node-pty @vscode/ripgrep
      - name: typecheck
        run: npm run -s typecheck
      - name: lint（只擋新錯誤）
        run: |
          mkdir -p ../ci-out
          # 固定 JSON 格式：GitHub Actions 上 oxlint 預設改用 ::error 註解格式，文字比對會漏判（2026-11-06 PR #10 首輪實際發生）
          npx oxlint -f json src/ server/ > ../ci-out/lint.json 2> ../ci-out/lint.stderr || true
          python3 -B scripts/enterprise/ci/compare_known_failures.py lint ../ci-out/lint.json | tee ../ci-out/lint-compare.json
      - name: backend tests（隔離 HOME；只擋新失敗）
        run: |
          export DHC_TEST_ROOT="$(mktemp -d)" NODE_OPTIONS="--import=$PWD/scripts/enterprise/隔離測試家目錄.mjs"
          npm test > ../ci-out/backend.tap 2>&1 || true
          python3 -B scripts/enterprise/ci/compare_known_failures.py backend ../ci-out/backend.tap | tee ../ci-out/backend-compare.json
      - name: frontend tests（只擋新失敗）
        run: |
          npx vitest run --reporter=json --outputFile=../ci-out/vitest.json > ../ci-out/vitest.txt 2>&1 || true
          python3 -B scripts/enterprise/ci/compare_known_failures.py frontend ../ci-out/vitest.json | tee ../ci-out/frontend-compare.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-verify-static-unit
          path: ci-out/
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: docker-compose shim（驗證腳本呼叫 docker-compose）
        run: |
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - name: npm ci
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 node-pty
      - name: 真 PostgreSQL 16（固定 digest，含 RLS／角色 init）跑全部企業整合測試
        run: |
          python3 -B - <<'PY'
          import glob, subprocess, sys
          tests = sorted(glob.glob('server/modules/enterprise-api/tests/*.integration.test.ts')) + sorted(glob.glob('server/modules/enterprise-persistence/tests/*.integration.test.ts'))
          sys.exit(subprocess.run(['python3', '-B', 'scripts/enterprise/驗證文件版本.py', '--evidence', 'ci-evidence/pg-integration', *tests]).returncode)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-verify-postgres
          path: web-ui/ci-evidence/
          retention-days: 7
      - name: 清理本工作的容器
        if: always()
        run: docker ps -aq | xargs -r docker rm -f
