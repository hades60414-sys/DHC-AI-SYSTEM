# DHC AI Office Enterprise：型別、lint、後端、前端與真 PostgreSQL 整合（web-ui/）。
# 不使用任何 secret；fork PR 以唯讀 token 執行。V3.2 原本就有的失敗由 known-v32-baseline-failures.json 比對，只有新失敗才讓 CI 失敗。
name: enterprise-verify
on:
  pull_request:
    # main，以及 stacked PR 的 base（V4 整合分支）——讓 V5 PR 也觸發完整驗證
    branches: [main, 'integration/enterprise-rcfix-v4-20261106', 'feature/ai-office-backend-v5-20261106']
    paths: ['web-ui/**', '.github/workflows/enterprise-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: web-ui
jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: npm ci（不執行 lifecycle scripts）＋原生模組重建
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # 原生模組與 ripgrep 執行檔（對話搜尋測試需要；--ignore-scripts 不會下載）
          npm rebuild better-sqlite3 node-pty @vscode/ripgrep
      - name: CI 基線比對器自身的單元測試（24 種失敗情境）
        run: python3 -B scripts/enterprise/ci/test_compare_known_failures.py
      - name: typecheck
        run: npm run -s typecheck
      - name: lint（只擋新錯誤）
        run: |
          mkdir -p ../ci-out
          # 固定 JSON 格式：GitHub Actions 上 oxlint 預設改用 ::error 註解格式，文字比對會漏判（2026-11-06 PR #10 首輪實際發生）
          npx oxlint -f json src/ server/ > ../ci-out/lint.json 2> ../ci-out/lint.stderr || true
          python3 -B scripts/enterprise/ci/compare_known_failures.py lint ../ci-out/lint.json | tee ../ci-out/lint-compare.json
      - name: backend tests（隔離 HOME；只擋新失敗）
        run: |
          export DHC_TEST_ROOT="$(mktemp -d)" NODE_OPTIONS="--import=$PWD/scripts/enterprise/隔離測試家目錄.mjs"
          npm test > ../ci-out/backend.tap 2>&1 || true
          python3 -B scripts/enterprise/ci/compare_known_failures.py backend ../ci-out/backend.tap | tee ../ci-out/backend-compare.json
      - name: frontend tests（只擋新失敗）
        run: |
          npx vitest run --reporter=json --outputFile=../ci-out/vitest.json > ../ci-out/vitest.txt 2>&1 || true
          python3 -B scripts/enterprise/ci/compare_known_failures.py frontend ../ci-out/vitest.json | tee ../ci-out/frontend-compare.json
      - name: 確定性引擎效能邊界（ACC-MATCH 5 萬列上限、OPS-REPORT 5 萬列、匯出 5 萬案件；只記錄耗時，不設門檻）
        run: npx tsx --tsconfig server/tsconfig.json scripts/enterprise/ci/engine-bench.ts ../ci-out/engine-bench.json
      - name: 路線圖產出與證據路徑一致
        run: python3 -B scripts/enterprise/render_roadmap.py --check
      - name: V5.1 UAT 證據索引完整性（引用的測試檔與標題必須存在）
        run: python3 -B scripts/enterprise/uat_evidence_index.py --check
      - name: V5.1 OPS-REPORT 資源邊界探針（合法 5 萬列完成、超限依代碼拒收；記錄耗時與子行程峰值 RSS）
        run: npx tsx --tsconfig server/tsconfig.json scripts/enterprise/ci/ops-resource-probe.ts ../ci-out/ops-resource-probe.json
      - name: V5.1 CSV 公式注入實測素材（真 ACC-MATCH 拒收結果的匯出＋未防護對照組）
        run: npx tsx --tsconfig server/tsconfig.json scripts/enterprise/ci/csv-formula-fixtures.ts ../ci-out/csv-formula
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-verify-static-unit
          path: ci-out/
          retention-days: 7

  csv-spreadsheet-safety:
    # V5.1 RG-V5-02：以真實試算表（LibreOffice Calc 無頭、開啟求值公式）匯入，驗證匯出 CSV 不會被當公式執行。Excel 無法在 Linux runner 執行。
    needs: static-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: enterprise-verify-static-unit
          path: ci-in
      - name: 安裝 LibreOffice Calc（nogui）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui > /dev/null
          soffice --version
      - name: 匯入並檢查顯示值
        run: |
          mkdir -p ../ci-out
          python3 -B scripts/enterprise/ci/check_spreadsheet_import.py ../ci-in/csv-formula ../ci-out/spreadsheet-import.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-verify-csv-spreadsheet
          path: ci-out/
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: docker-compose shim（驗證腳本呼叫 docker-compose）
        run: |
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose version
      - name: npm ci
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3 node-pty
      - name: 真 PostgreSQL 16（固定 digest，含 RLS／角色 init）跑全部企業整合測試
        run: |
          python3 -B - <<'PY'
          import glob, subprocess, sys
          tests = sorted(glob.glob('server/modules/enterprise-api/tests/*.integration.test.ts')) + sorted(glob.glob('server/modules/enterprise-persistence/tests/*.integration.test.ts'))
          sys.exit(subprocess.run(['python3', '-B', 'scripts/enterprise/驗證文件版本.py', '--evidence', 'ci-evidence/pg-integration', *tests]).returncode)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-verify-postgres
          path: web-ui/ci-evidence/
          retention-days: 7
      - name: 清理本工作的容器
        if: always()
        run: docker ps -aq | xargs -r docker rm -f
