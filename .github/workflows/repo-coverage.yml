# V5.2 RG-003：整個 DAS repository 的覆蓋契約與靜態語法檢查（不限 web-ui 路徑）。
# 只解析／編譯，不執行任何模組程式；vendor 不解析；C#／PowerShell 記 NOT_RUN（需 Windows）。Enterprise CI 綠燈不代表這些模組的 runtime。
name: repo-coverage
on:
  pull_request:
    branches: [main, 'integration/enterprise-rcfix-v4-20261106', 'feature/ai-office-backend-v5-20261106', 'fix/ai-office-v51-repoguard-hardening']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  coverage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: 覆蓋契約（每個頂層路徑都需分類）＋非 web-ui 模組 JS／Python 語法
        run: |
          mkdir -p ci-out
          python3 -B web-ui/scripts/enterprise/ci/check_repo_coverage.py ci-out/repo-coverage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: repo-coverage
          path: ci-out/
          retention-days: 7
