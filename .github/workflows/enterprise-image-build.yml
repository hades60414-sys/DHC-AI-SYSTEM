          summary = {'source_sha': os.environ['SOURCE_SHA'], 'runtime_base': os.environ['RUNTIME_BASE'], 'image_id': meta['Id'],
                     'architecture': f"{meta['Os']}/{meta['Architecture']}", 'repo_digests': meta.get('RepoDigests'),
                     'source_revision': labels.get('org.opencontainers.image.revision'), 'profile': labels.get('com.dhc.image.profile'),
                     'license': labels.get('org.opencontainers.image.licenses'), 'oci_manifest_digest': None,
