# DHC AI Office Enterprise image：build-amd64／build-arm64 各在原生 GitHub-hosted runner 建置（不跑 QEMU），
# 之後以同一次執行產生的 image 做交付 QA（enterprise-delivery-smoke.yml，reusable）。
# 不推送任何 registry；image 只以 1 天 artifact 傳給交付 QA。報告 artifact 保留 7 天。
name: enterprise-image-build
on:
  pull_request:
    # main，以及 stacked PR 的 base（V4 整合分支）——讓 V5 PR 也觸發完整驗證
    branches: [main, 'integration/enterprise-rcfix-v4-20261106', 'feature/ai-office-backend-v5-20261106', 'fix/ai-office-v51-repoguard-hardening']
    paths: ['web-ui/**', '.github/workflows/enterprise-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUNTIME_BASE: node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
  TRIVY_IMAGE: aquasec/trivy:0.57.1@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b
jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARCH: amd64
    defaults:
      run:
        # V5.2 ASTRA-ROLL-001：明定 bash＝-eo pipefail，管線（| tee）不再遮蔽失敗
        shell: bash
        working-directory: web-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: 確認原生架構與容量（建置前）
        run: |
          mkdir -p ../ci-out
          uname -m | tee ../ci-out/runner-arch.txt
          case "$ARCH:$(uname -m)" in amd64:x86_64|arm64:aarch64) echo native;; *) echo "runner 架構不符，拒絕以模擬冒充"; exit 1;; esac
          { df -h; docker system df; } | tee ../ci-out/capacity-before.txt
      - name: buildx build（enterprise profile、固定 runtime base、source label；GHA BuildKit cache）
        run: |
          docker buildx build --progress=plain --platform linux/$ARCH \
            -f deploy/customer-single/Dockerfile \
            --build-arg DHC_IMAGE_PROFILE=enterprise --build-arg RUNTIME_BASE="$RUNTIME_BASE" --build-arg DHC_SOURCE_SHA="$SOURCE_SHA" \
            --cache-from type=gha,scope=enterprise-$ARCH --cache-to type=gha,mode=max,scope=enterprise-$ARCH \
            -t dhc-ai-office:ci-$ARCH --load . 2>&1 | tee ../ci-out/build.log
          printf '%s\n' "docker buildx build --platform linux/$ARCH -f deploy/customer-single/Dockerfile --build-arg DHC_IMAGE_PROFILE=enterprise --build-arg RUNTIME_BASE=$RUNTIME_BASE --build-arg DHC_SOURCE_SHA=$SOURCE_SHA" > ../ci-out/build-command.txt
      - name: image inspect（ID、架構、source revision、profile）
        run: |
          docker image inspect dhc-ai-office:ci-$ARCH > ../ci-out/image-inspect.json
          python3 - <<'PY'
          import json, os
          meta = json.load(open('../ci-out/image-inspect.json'))[0]
          labels = meta['Config'].get('Labels') or {}
          arch = os.environ['ARCH']
          summary = {'source_sha': os.environ['SOURCE_SHA'], 'runtime_base': os.environ['RUNTIME_BASE'], 'image_id': meta['Id'],
                     'architecture': f"{meta['Os']}/{meta['Architecture']}", 'repo_digests': meta.get('RepoDigests'),
                     'source_revision': labels.get('org.opencontainers.image.revision'), 'profile': labels.get('com.dhc.image.profile'),
                     'license': labels.get('org.opencontainers.image.licenses'), 'oci_manifest_digest': None,
                     'note': '未推送 registry，沒有 registry manifest digest'}
          json.dump(summary, open('../ci-out/image-summary.json', 'w'), indent=1)
          print(json.dumps(summary, indent=1))
          assert summary['source_revision'] == os.environ['SOURCE_SHA'], 'source label 與 PR head 不符'
          assert summary['profile'] == 'enterprise'
          assert summary['architecture'] == f'linux/{arch}'
          PY
      - name: 執行期 smoke（原生模組、pdfjs、無網路）
        run: |
          docker run --rm --network none --entrypoint node dhc-ai-office:ci-$ARCH -e "console.log(process.arch, process.version); require('better-sqlite3'); require('node-pty'); import('pdfjs-dist/legacy/build/pdf.mjs').then(() => console.log('pdfjs ok'))" | tee ../ci-out/smoke.txt
      - name: SBOM／依賴與授權 inventory（實際 image；雙獨立枚舉器）
        run: python3 -B scripts/enterprise/rcfix/image_sbom.py dhc-ai-office:ci-$ARCH ../ci-out/sbom
      - name: Trivy（vuln；上傳結果，不以閾值阻擋——處置見交接文件）
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --scanners vuln --format json --quiet dhc-ai-office:ci-$ARCH > ../ci-out/trivy.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open('../ci-out/trivy.json')); out = {}
          for r in d.get('Results', []):
              c = collections.Counter(v['Severity'] for v in r.get('Vulnerabilities') or [])
              out[r.get('Class')] = {s: c.get(s, 0) for s in ['CRITICAL', 'HIGH']}
          json.dump(out, open('../ci-out/trivy-summary.json', 'w'), indent=1); print(out)
          PY
      - name: 匯出 image（交付 QA 用；短期 artifact）＋SHA256
        run: |
          mkdir -p ../image-out
          docker save dhc-ai-office:ci-$ARCH | gzip -1 > ../image-out/dhc-ai-office-$ARCH.tar.gz
          (cd ../image-out && sha256sum dhc-ai-office-$ARCH.tar.gz | tee SHA256SUMS)
          cp ../image-out/SHA256SUMS ../ci-out/image-SHA256SUMS
          { df -h; docker system df; } | tee ../ci-out/capacity-after.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enterprise-image-archive-amd64
          path: image-out/
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-image-report-amd64
          path: ci-out/
          retention-days: 7

  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ARCH: arm64
    defaults:
      run:
        # V5.2 ASTRA-ROLL-001：明定 bash＝-eo pipefail，管線（| tee）不再遮蔽失敗
        shell: bash
        working-directory: web-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: 確認原生架構與容量（建置前）
