            --cache-from type=gha,scope=enterprise-$ARCH --cache-to type=gha,mode=max,scope=enterprise-$ARCH \
            -t dhc-ai-office:ci-$ARCH --load . 2>&1 | tee ../ci-out/build.log
          printf '%s\n' "docker buildx build --platform linux/$ARCH -f deploy/customer-single/Dockerfile --build-arg DHC_IMAGE_PROFILE=enterprise --build-arg RUNTIME_BASE=$RUNTIME_BASE --build-arg DHC_SOURCE_SHA=$SOURCE_SHA" > ../ci-out/build-command.txt
      - name: image inspect（ID、架構、source revision、profile）
