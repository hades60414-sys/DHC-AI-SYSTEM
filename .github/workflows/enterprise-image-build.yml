  upgrade-rollback-amd64:
    # V5.1 Batch D：V4（PR #10 固定 head 1e481e2）image → 本次 image 的升級與回退，原生 amd64；只用合成資料與 mock 模型。
    needs: build-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARCH: amd64
      OLD_SOURCE: 1e481e2fca812dcd2bfc45645623129bd7b54dea
      # V4 CI 當時的 runtime base（舊版 image 依舊版管線重建，不套用 V5.1 的新 base）
      OLD_RUNTIME_BASE: node:22-bookworm-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
    defaults:
      run:
        # V5.2 ASTRA-ROLL-001：明定 bash＝-eo pipefail，管線（| tee）不再遮蔽失敗
        shell: bash
        working-directory: web-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.OLD_SOURCE }}
          path: old-src
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: 建置舊版（V4）image（固定來源 SHA 與舊 runtime base）
        working-directory: old-src/web-ui
        run: |
          docker buildx build --progress=plain --platform linux/$ARCH -f deploy/customer-single/Dockerfile \
            --build-arg DHC_IMAGE_PROFILE=enterprise --build-arg RUNTIME_BASE="$OLD_RUNTIME_BASE" --build-arg DHC_SOURCE_SHA="$OLD_SOURCE" \
            -t dhc-ai-office:v4-old --load . > /tmp/old-build.log 2>&1 || { tail -50 /tmp/old-build.log; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: enterprise-image-archive-${{ env.ARCH }}
          path: image-in
      - name: 驗證並載入本次 image
        run: |
          mkdir -p ci-evidence
          (cd ../image-in && sha256sum -c SHA256SUMS) | tee ci-evidence/image-sha-check.txt
          docker load -i ../image-in/dhc-ai-office-$ARCH.tar.gz | tee ci-evidence/image-load.txt
          rm -f ../image-in/dhc-ai-office-$ARCH.tar.gz
          { df -h; docker system df; } | tee ci-evidence/capacity-before.txt
      - name: docker-compose shim
        run: |
          printf '#!/bin/sh\nexec docker compose "$@"\n' | sudo tee /usr/local/bin/docker-compose >/dev/null
          sudo chmod +x /usr/local/bin/docker-compose
      - name: 升級（V4→本次）與回退（還原升級前備份到 V4）
        run: python3 -B scripts/enterprise/ci/upgrade_rollback.py --old-image dhc-ai-office:v4-old --old-source "$OLD_SOURCE" --new-image dhc-ai-office:ci-$ARCH --new-source "$SOURCE_SHA" --evidence ci-evidence/upgrade-rollback
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: enterprise-upgrade-rollback-${{ env.ARCH }}
          path: |
            web-ui/ci-evidence/
            !web-ui/ci-evidence/**/*.tar
            !web-ui/ci-evidence/**/*.tar.gz
          retention-days: 7
      - name: 清理本工作的容器與 volume
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f
          docker volume ls -q | grep '^dhc-upgrade-' | xargs -r docker volume rm || true

  delivery-amd64:
    needs: build-amd64
    uses: ./.github/workflows/enterprise-delivery-smoke.yml
    with:
      arch: amd64
      runner: ubuntu-24.04
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
  delivery-arm64:
    needs: build-arm64
    uses: ./.github/workflows/enterprise-delivery-smoke.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
